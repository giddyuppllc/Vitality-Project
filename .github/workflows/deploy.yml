name: Deploy to Hetzner

on:
  push:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy (SSH)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install SSH key
        env:
          DEPLOY_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "${{ secrets.HETZNER_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy over SSH
        env:
          HETZNER_HOST: ${{ secrets.HETZNER_HOST }}
          HETZNER_USER: ${{ secrets.HETZNER_USER || 'root' }}
        run: |
          # -T: no pseudo-TTY, and the remote script comes from the heredoc on
          # stdin. See the -T on `compose run` below — without it that command
          # ATE the rest of this script.
          ssh -T -i ~/.ssh/id_ed25519 "$HETZNER_USER@$HETZNER_HOST" <<'EOF'
            set -euo pipefail
            cd /opt/vitality
            git fetch --all --prune
            git reset --hard origin/master
            # Sync the DB schema (+ first-time post seed) BEFORE the new app
            # serves, using the builder-stage one-shot (the runtime image has no
            # prisma CLI). Fails the deploy if the migration errors, so a bad
            # schema change never ships against a stale DB.
            docker compose --profile migrate build migrate
            # -T AND </dev/null are both load-bearing.
            #
            # This script reaches the box as ssh's STDIN (the heredoc above).
            # `docker compose run` without -T attaches the container to that
            # same stdin — so it CONSUMED the remaining lines of this script as
            # container input. `compose pull` and `compose up --build app`
            # never executed, ssh still exited 0, and the workflow reported
            # SUCCESS.
            #
            # The result: every deploy pulled the new code onto the box and
            # left the OLD container running. `git log` on the server showed
            # the new commit while users were served a build up to 13 days old
            # — indistinguishable from "my change didn't do anything".
            docker compose --profile migrate run --rm -T migrate < /dev/null
            docker compose pull </dev/null || true
            docker compose up -d --build app </dev/null
            # Fail loudly if the app container was not actually recreated.
            docker compose ps app
            docker image prune -f || true
          EOF

      - name: Smoke check /api/health
        if: success()
        run: |
          sleep 15
          # Use the public Cloudflare-proxied domain, not the SSH IP
          curl --fail --silent --show-error --max-time 30 \
            "https://vitalityproject.global/api/health" || exit 1
